<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Lookup</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<h1>Weather Information</h1>

<div class="search">
    <input type="number" id="latitude" placeholder="Enter Latitude" />
    <input type="number" id="longitude" placeholder="Enter Longitude" />
    <button onclick="loadWeather()">Search</button>
</div>

<p id="status"></p>

<div id="weatherCard" class="card hidden">
    <table>
        <tbody>
        <tr>
            <th>Temperature: </th>
            <td id="temperature"></td>
        </tr>
        <tr>
            <th>Wind Speed: </th>
            <td id="windspeed"></td>
        </tr>
        <tr>
            <th>Wind Direction: </th>
            <td id="winddirection"></td>
        </tr>
    </table>
</div>

<script src="app.js"></script>
</body>
</html>
